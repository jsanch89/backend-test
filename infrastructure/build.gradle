apply plugin: 'org.springframework.boot'
apply plugin: 'org.openapi.generator'

dependencies {
    implementation project(':application')
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.52'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

def generatedApiDir = layout.buildDirectory.dir('generated')

openApiGenerate {
    generatorName = 'spring'
    inputSpec = "$projectDir/src/main/resources/api/similarProducts.yaml"
    outputDir = generatedApiDir.get().asFile.path
    apiPackage = 'com.gft.similarproducts.infrastructure.generated.api'
    modelPackage = 'com.gft.similarproducts.infrastructure.generated.model'
    configOptions = [
        interfaceOnly       : 'true',
        skipDefaultInterface: 'true',
        useSpringBoot3      : 'true',
        reactive            : 'true',
        useTags             : 'true',
        dateLibrary         : 'java8',
        openApiNullable     : 'false',
    ]
    globalProperties = [
        models: '',
        apis  : '',
    ]
}

sourceSets {
    main {
        java {
            srcDir generatedApiDir.map { it.dir('src/main/java') }
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}
